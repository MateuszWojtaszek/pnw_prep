[project]
name = "pnw-prep"
version = "0.1.0"
description = "This is a preperation project for pnw - pl: Projekt naukowo wdrożeniowy"
readme = "README.md"
authors = [
    { name = "Mateusz Wojtaszek", email = "mateusz.wojtaszek@icloud.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pnw-prep = "pnw_prep:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.0",
    "ruff>=0.16.6",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.13.5",
    "sphinx-copybutton>=0.5.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"docs/conf.py" = ["D100"]
